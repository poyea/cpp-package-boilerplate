name: docs

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit to publish to GitHub Pages
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Set up CMake (latest)
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 'latest'
      - name: Install docs toolchain
        run: |
          bash scripts/install_gcc.sh
          sudo apt-get install -y doxygen graphviz ninja-build
      - name: Build docs
        env:
          CC: gcc-16
          CXX: g++-16
        run: cmake --workflow --preset docs
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/docs/site/html

  deploy-docs:
    if: github.event_name == 'workflow_dispatch'
    needs: build-docs
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
