name: docs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up CMake (latest)
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 'latest'
      - name: Install docs toolchain
        run: |
          # Same pinned sid source as ci.yml. The PPA only has pre-release
          # 16.0.x, which the 16.1 floor in CMakeLists.txt rejects at configure.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debian-archive-keyring

          echo "deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://deb.debian.org/debian sid main" \
            | sudo tee /etc/apt/sources.list.d/debian-sid.list

          printf 'Package: *\nPin: release o=Debian\nPin-Priority: 100\n\nPackage: gcc-16 gcc-16-* g++-16 g++-16-* cpp-16 cpp-16-* gcc-16-base libgcc-16-dev libstdc++-16-dev libstdc++6 libgcc-s1 libgomp1 libitm1 libatomic1 libquadmath0 libcc1-0 libasan8 libubsan1 liblsan0 libtsan2 libhwasan0\nPin: release o=Debian\nPin-Priority: 990\n' \
            | sudo tee /etc/apt/preferences.d/debian

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-16 g++-16
          sudo apt-get install -y doxygen graphviz ninja-build
          g++-16 --version
      - name: Configure docs
        env:
          CC: gcc-16
          CXX: g++-16
          PROJECT_VERSION: ${{ github.ref_name }}
        run: cmake -S . -B build/docs -G Ninja -DCPP_PACKAGE_BOILERPLATE_BUILD_TESTS=OFF -DCPP_PACKAGE_BOILERPLATE_BUILD_BENCHMARKS=OFF -DCPP_PACKAGE_BOILERPLATE_BUILD_DOCS=ON
      - name: Build docs
        run: cmake --build build/docs --target docs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/docs/site/html

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

