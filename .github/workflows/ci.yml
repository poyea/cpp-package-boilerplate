name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: bash scripts/format.sh --check
      - name: Check shell scripts
        run: shellcheck scripts/*.sh .devcontainer/post-create.sh

  build-and-test:
    needs: format
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            compiler: gcc-16
            cc: gcc-16
            cxx: g++-16
          - os: ubuntu-24.04
            compiler: clang-22
            cc: clang-22
            cxx: clang++-22
          - os: ubuntu-24.04
            compiler: clang-18
            cc: clang-18
            cxx: clang++-18
          - os: macos-15
            compiler: apple-clang
            cc: clang
            cxx: clang++
          - os: windows-2022
            compiler: msvc
            cc: cl
            cxx: cl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
      - name: Set up MSVC developer shell
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Ninja on Windows
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y
      - name: Install Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Set up CMake (latest)
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 'latest'
      - name: Install toolchain on Ubuntu
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.compiler }}" = "gcc-16" ]; then
            bash scripts/install_gcc.sh
            sudo apt-get install -y ninja-build
          elif [ "${{ matrix.compiler }}" = "clang-22" ]; then
            sudo apt-get update && sudo apt-get install -y ninja-build
            wget -q https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 22
          elif [ "${{ matrix.compiler }}" = "clang-18" ]; then
            sudo apt-get update && sudo apt-get install -y ninja-build clang-18
          fi
      - name: Set up compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler }}
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
      - name: Configure, build and test
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
        run: cmake --workflow --preset debug-vcpkg
      - name: Build and run benchmarks
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
        run: |
          cmake --workflow --preset benchmarks-vcpkg
          build/benchmarks-vcpkg/benchmarks/cpp_package_boilerplate_benchmarks

  clang-tidy:
    needs: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up CMake (latest)
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 'latest'
      - name: Install clang toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
      - name: Build with clang-tidy
        env:
          CC: clang-22
          CXX: clang++-22
        run: cmake --workflow --preset tidy-vcpkg
